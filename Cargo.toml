[package]
name = "notify"
version = "0.2.1"
edition = "2021"
description = "Notifications: rules over what the recorder hears (signals, tones, emergencies, new talkgroups and radios), sent to webhooks (Discord, Slack, ntfy, JSON) and commands."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-notify"
authors = ["Taclane"]
publish = false

[dependencies]
# SDK 0.7.0 (plugin pages, buttons, live settings, tone patterns) is in Trunk Recorder Pro v0.2.10
# but not on crates.io yet: built from that release. Becomes trunk-recorder-plugin = "0.7.0" once published.
trunk-recorder-plugin = { git = "https://github.com/TrunkRecorder/trunk-recorder-pro", tag = "v0.2.10" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = true
